[workspace]
resolver = "3"
members = [
  "crates/openwrt-core",
  "crates/openwrt-mobile",
  "crates/openwrt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["OpenWRT-Status-APP contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.48.0", features = ["rt", "macros", "time", "io-util", "sync"] }
russh = { version = "0.63.0", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.4.0"
sha2 = "0.10.9"
thiserror = "2.0.17"
url = { version = "2.5.7", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
