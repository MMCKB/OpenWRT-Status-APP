name: Verify Flutter UI and Rust core

on:
  push:
    branches:
      - Rust-Dev
  pull_request:
    branches:
      - Rust-Dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-rust-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter stable · Rust 1.98 · Android ARM64
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust 1.98 and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
          components: rustfmt

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK and NDK r27d
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, and NDK r27d
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Check Rust core and FFI boundary
        working-directory: rust
        run: |
          cargo fmt --check
          cargo test -p openwrt-ffi
          cargo check --workspace

      - name: Check Flutter UI
        working-directory: flutter_client
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter ARM64 debug APK with Rust core
        working-directory: flutter_client
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify Rust library embedded in APK
        run: |
          unzip -l flutter_client/build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/arm64-v8a/libopenwrt_ffi.so'

      - name: Upload Flutter Rust ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-status-flutter-rust-arm64-apk
          path: flutter_client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
