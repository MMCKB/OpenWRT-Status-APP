name: Verify Rust Android client

on:
  push:
    branches:
      - Rust-Dev
  pull_request:
    branches:
      - Rust-Dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust 1.98 · Dioxus Android ARM64
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.3.13750724
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust 1.98 and Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
          components: rustfmt

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK and NDK r27d
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install Dioxus CLI 0.7.10
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Check Rust workspace
        working-directory: rust
        run: |
          cargo fmt --check
          cargo check --workspace
          cargo test --workspace
          cargo run -p openwrt-cli

      - name: Bundle verified Android ARM64 AAB
        run: ./rust/scripts/build-android-arm64.sh

      - name: Upload ARM64 AAB
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-status-rust-arm64
          path: rust/target/dx/openwrt-mobile/release/android/app/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
